# Independent scheduler for create-vm.yml. It never enables the worker.
name: OCI A1 Scheduler

on:
  schedule:
    - cron: '*/6 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = read-only; dispatch = request one real worker launch'
        type: choice
        required: true
        default: check
        options:
          - check
          - dispatch

permissions:
  actions: write

concurrency:
  group: oci-free-arm-scheduler
  cancel-in-progress: false

jobs:
  tick:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' || vars.OCI_SNATCH_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check or dispatch the guarded worker
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SNATCH_ENABLED: ${{ vars.OCI_SNATCH_ENABLED }}
          SCHEDULER_MODE: ${{ github.event_name == 'schedule' && 'dispatch' || inputs.mode }}
        run: |
          python3 - <<'PY'
          """Keep the scheduler active; dispatch only an active, separately guarded worker."""
          import json
          import os
          import urllib.request
          
          
          def request(url, token, payload=None):
              req = urllib.request.Request(
                  url,
                  data=None if payload is None else json.dumps(payload).encode(),
                  method="GET" if payload is None else "POST",
                  headers={"Authorization": "Bearer " + token,
                           "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json",
                           "X-GitHub-Api-Version": "2022-11-28"},
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response) if payload is None else None
          
          
          def note(message):
              print(message, flush=True)
              path = os.environ.get("GITHUB_STEP_SUMMARY")
              if path:
                  with open(path, "a", encoding="utf-8") as out:
                      out.write(message + "\n\n")
          
          
          def main(env, api=request, emit=note):
              mode = env.get("SCHEDULER_MODE", "check")
              if mode not in ("check", "dispatch"):
                  raise ValueError("SCHEDULER_MODE must be check or dispatch.")
              repo = env["GITHUB_REPOSITORY"]
              branch = env["DEFAULT_BRANCH"]
              if not branch or env.get("GITHUB_REF") != "refs/heads/" + branch:
                  raise ValueError("Scheduler must run on the default branch.")
              emit("TIMER: event=" + env["GITHUB_EVENT_NAME"] + "; mode=" + mode + ".")
              if mode == "dispatch" and env.get("SNATCH_ENABLED") != "true":
                  emit("OFF: OCI_SNATCH_ENABLED is not true. No worker was dispatched.")
                  return
              url = "https://api.github.com/repos/" + repo + "/actions/workflows/create-vm.yml"
              token = env["GH_TOKEN"]
              worker = api(url, token)
              state = worker["state"]
              if mode == "check":
                  emit("CHECK OK: worker state=" + state + "; OCI_SNATCH_ENABLED=" +
                       ("true" if env.get("SNATCH_ENABLED") == "true" else "false/unset") +
                       ". No worker was dispatched and no OCI API was called.")
                  return
              if state != "active":
                  emit("PAUSED: create-vm.yml is " + state +
                       ". It was NOT enabled or dispatched. Check its previous result in Actions/OCI.")
                  return
              api(url + "/dispatches", token,
                  {"ref": branch, "inputs": {"mode": "launch"}})
              emit("DISPATCHED: requested one create-vm.yml launch run. "
                   "This does not mean an OCI instance was created; inspect the worker result.")
          
          
          if __name__ == "__main__":
              try:
                  main(os.environ)
              except Exception as exc:
                  note("SCHEDULER ERROR: " + type(exc).__name__ + ": " + str(exc) +
                       ". No immediate retry; inspect Actions before retrying manually.")
                  raise SystemExit(1)
          PY
