# Reviewed upstream: heykapil/oci-free-arm-instance @ 9e0bc340dba67283b924c979ce5f3ffd7efe767b
# Local adaptation, 2026-11-05. Keep the upstream MIT LICENSE when redistributing.
# Upload this file as .github/workflows/create-vm.yml (replace the original).
name: OCI A1 Singapore - guarded attempts

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = read-only; launch = one real creation attempt'
        type: choice
        required: true
        default: check
        options:
          - check
          - launch

permissions:
  actions: write

concurrency:
  group: oci-free-arm-create
  cancel-in-progress: false

jobs:
  provision:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' || vars.OCI_SNATCH_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install official OCI SDK in an isolated environment
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/oci-venv"
          "$RUNNER_TEMP/oci-venv/bin/python" -m pip install --disable-pip-version-check 'oci==2.190.0'

      - name: Check configuration or make one guarded launch attempt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_MODE: ${{ github.event_name == 'schedule' && 'launch' || inputs.mode }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          IMAGE_ID: ${{ secrets.IMAGE_ID }}
          TARGET_NAME: sg-free-arm-auto
          TARGET_OCPUS: '2'
          TARGET_MEMORY_GB: '12'
          TARGET_BOOT_GB: '100'
        run: |
          "$RUNNER_TEMP/oci-venv/bin/python" - <<'PY'
          """Single OCI launch attempt; GitHub schedule is disabled before any write to OCI."""
          import base64
          import hashlib
          import json
          import math
          import os
          from pathlib import Path
          import tempfile
          import urllib.parse
          import urllib.request
          
          import oci
          
          SHAPE = "VM.Standard.A1.Flex"
          
          
          def required(env, name):
              value = env.get(name, "").strip()
              if not value:
                  raise ValueError(f"Missing GitHub secret: {name}")
              return value
          
          
          def note(message):
              print(message, flush=True)
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a", encoding="utf-8") as out:
                      out.write(message + "\n\n")
          
          
          class Workflow:
              def __init__(self, env):
                  repo = required(env, "GITHUB_REPOSITORY")
                  ref = required(env, "GITHUB_WORKFLOW_REF")
                  filename = ref.split("@", 1)[0].rsplit("/", 1)[-1]
                  self.url = ("https://api.github.com/repos/" + repo +
                              "/actions/workflows/" + urllib.parse.quote(filename, safe=""))
                  self.token = required(env, "GH_TOKEN")
          
              def call(self, action=None):
                  req = urllib.request.Request(
                      self.url + ("/" + action if action else ""),
                      method="PUT" if action else "GET",
                      headers={"Authorization": "Bearer " + self.token,
                               "Accept": "application/vnd.github+json",
                               "X-GitHub-Api-Version": "2022-11-28"},
                  )
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return json.load(response) if not action else None
          
              def active(self):
                  return self.call()["state"] == "active"
          
              def disable(self):
                  self.call("disable")
          
              def enable(self):
                  self.call("enable")
          
          
          def settings(env):
              cfg = {name: required(env, name) for name in (
                  "OCI_CLI_USER", "OCI_CLI_TENANCY", "OCI_CLI_FINGERPRINT",
                  "OCI_CLI_REGION", "OCI_CLI_KEY_CONTENT", "OCI_COMPARTMENT_ID",
                  "OCI_SUBNET_ID", "SSH_PUBLIC_KEY",
              )}
              if cfg["OCI_CLI_REGION"] not in ("ap-singapore-1", "ap-singapore-2"):
                  raise ValueError("This workflow is restricted to Singapore regions.")
              cfg["ocpus"] = int(env.get("TARGET_OCPUS", "1"))
              cfg["memory"] = float(env.get("TARGET_MEMORY_GB", "6"))
              cfg["boot"] = int(env.get("TARGET_BOOT_GB", "50"))
              if cfg["ocpus"] not in (1, 2):
                  raise ValueError("TARGET_OCPUS must be 1 or 2.")
              if not math.isfinite(cfg["memory"]) or not 1 <= cfg["memory"] <= 12:
                  raise ValueError("TARGET_MEMORY_GB must be between 1 and 12.")
              if not 50 <= cfg["boot"] <= 200:
                  raise ValueError("TARGET_BOOT_GB must be between 50 and 200.")
              cfg["name"] = env.get("TARGET_NAME", "sg-free-arm-auto").strip()
              if not cfg["name"]:
                  raise ValueError("TARGET_NAME cannot be empty.")
              key = cfg["SSH_PUBLIC_KEY"]
              parts = key.split()
              if ("PRIVATE KEY" in key or len(key.splitlines()) != 1 or len(parts) < 2
                      or parts[0] not in ("ssh-rsa", "ssh-ed25519")):
                  raise ValueError("SSH_PUBLIC_KEY must contain one OpenSSH PUBLIC key.")
              base64.b64decode(parts[1], validate=True)
              if "PRIVATE KEY" not in cfg["OCI_CLI_KEY_CONTENT"]:
                  raise ValueError("OCI_CLI_KEY_CONTENT must contain the PEM API private key.")
              cfg["image_id"] = env.get("IMAGE_ID", "").strip()
              return cfg
          
          
          def all_items(call, *args, **kwargs):
              return oci.pagination.list_call_get_all_results(call, *args, **kwargs).data
          
          
          def check_budget(ocpus, memory, storage, cfg):
              # Resource quantities only: this does not inspect pricing or historic usage.
              if ocpus + cfg["ocpus"] > 2 or memory + cfg["memory"] > 12:
                  raise ValueError("Existing A1 + target would exceed 2 OCPU / 12 GB.")
              if storage + cfg["boot"] > 200:
                  raise ValueError("Existing boot/block volumes + target would exceed 200 GB.")
          
          
          def preflight(cfg, identity, compute, network, block):
              tenant = cfg["OCI_CLI_TENANCY"]
              region = cfg["OCI_CLI_REGION"]
              regions = all_items(identity.list_region_subscriptions, tenant)
              home = next((r.region_name for r in regions if r.is_home_region), None)
              if home != region:
                  raise ValueError("Configured region must equal the tenancy home region.")
          
              subnet = network.get_subnet(cfg["OCI_SUBNET_ID"]).data
              if subnet.lifecycle_state != "AVAILABLE" or subnet.prohibit_public_ip_on_vnic:
                  raise ValueError("OCI_SUBNET_ID must reference an available PUBLIC subnet.")
              ads = all_items(identity.list_availability_domains, tenant)
              names = [ad.name for ad in ads]
              if len(names) != 1:
                  raise ValueError("Expected exactly one AD; review this workflow before continuing.")
              ad = names[0]
              if subnet.availability_domain and subnet.availability_domain != ad:
                  raise ValueError("Subnet availability domain does not match.")
          
              compartments = all_items(
                  identity.list_compartments, tenant, compartment_id_in_subtree=True,
                  access_level="ANY", lifecycle_state="ACTIVE")
              ids = {tenant, *(c.id for c in compartments)}
              if cfg["OCI_COMPARTMENT_ID"] not in ids:
                  raise ValueError("OCI_COMPARTMENT_ID is not an active compartment in this tenancy.")
          
              cpu = memory = storage = 0
              for cid in sorted(ids):
                  for inst in all_items(compute.list_instances, cid):
                      if inst.lifecycle_state == "TERMINATED":
                          continue
                      if cid == cfg["OCI_COMPARTMENT_ID"] and inst.display_name == cfg["name"]:
                          note("EXISTS: A non-terminated instance already has the target name. No launch.")
                          return None
                      if inst.shape == SHAPE:
                          if (not inst.shape_config or inst.shape_config.ocpus is None
                                  or inst.shape_config.memory_in_gbs is None):
                              raise ValueError("Cannot determine existing A1 resources; refusing to launch.")
                          cpu += inst.shape_config.ocpus
                          memory += inst.shape_config.memory_in_gbs
                  volumes = all_items(block.list_volumes, compartment_id=cid)
                  volumes += all_items(block.list_boot_volumes, availability_domain=ad, compartment_id=cid)
                  for vol in volumes:
                      if vol.lifecycle_state == "TERMINATED":
                          continue
                      if vol.size_in_gbs is None:
                          raise ValueError("Cannot determine volume size; refusing to launch.")
                      storage += vol.size_in_gbs
              check_budget(cpu, memory, storage, cfg)
          
              images = all_items(
                  compute.list_images, cfg["OCI_COMPARTMENT_ID"],
                  operating_system="Canonical Ubuntu", operating_system_version="24.04",
                  shape=SHAPE, sort_by="TIMECREATED", sort_order="DESC")
              images = [i for i in images if "aarch64" in i.display_name.lower()
                        and i.lifecycle_state == "AVAILABLE"]
              if cfg["image_id"]:
                  images = [i for i in images if i.id == cfg["image_id"]]
              else:
                  regular = [i for i in images if "minimal" not in i.display_name.lower()]
                  images = regular or images
              if not images:
                  raise ValueError("No matching available Ubuntu 24.04 ARM64 image in this region.")
              image = images[0]
              note(f"CHECK: {region}; {ad}; {image.display_name}; "
                   f"target {cfg['ocpus']} OCPU / {cfg['memory']:g} GB / {cfg['boot']} GB boot.")
              note(f"Existing home-region resources: {cpu:g} A1 OCPU / {memory:g} GB RAM / "
                   f"{storage:g} GB boot+block storage. This is not a billing guarantee.")
              return oci.core.models.LaunchInstanceDetails(
                  compartment_id=cfg["OCI_COMPARTMENT_ID"], display_name=cfg["name"],
                  availability_domain=ad, shape=SHAPE,
                  shape_config=oci.core.models.LaunchInstanceShapeConfigDetails(
                      ocpus=cfg["ocpus"], memory_in_gbs=cfg["memory"]),
                  create_vnic_details=oci.core.models.CreateVnicDetails(
                      subnet_id=cfg["OCI_SUBNET_ID"], assign_public_ip=True,
                      assign_ipv6_ip=False),
                  source_details=oci.core.models.InstanceSourceViaImageDetails(
                      image_id=image.id, boot_volume_size_in_gbs=cfg["boot"],
                      boot_volume_vpus_per_gb=10),
                  metadata={"ssh_authorized_keys": cfg["SSH_PUBLIC_KEY"]},
              )
          
          
          def retryable_rejection(exc):
              message = (exc.message or "").lower()
              return (exc.status == 429 or
                      (exc.status in (400, 409, 500, 503) and
                       (exc.code in ("OutOfHostCapacity", "OutOfCapacity") or
                        "out of host capacity" in message or "out of capacity" in message)))
          
          
          def launch_once(compute, workflow, details, token):
              # The workflow is ALREADY disabled. Ambiguous failures must never re-enable it.
              try:
                  instance = compute.launch_instance(
                      details, opc_retry_token=token,
                      retry_strategy=oci.retry.NoneRetryStrategy()).data
              except oci.exceptions.ServiceError as exc:
                  if retryable_rejection(exc):
                      workflow.enable()
                      note("RETRY: OCI explicitly rejected this attempt for capacity/rate limiting. "
                           "Schedule re-enabled; no instance was accepted in this attempt.")
                      return
                  raise
              note("CREATED: OCI accepted the request. Workflow remains DISABLED. "
                   "Check Compute > Instances for the final instance status and public IP.")
              note(f"Instance OCID: `{instance.id}`; initial state: `{instance.lifecycle_state}`.")
          
          
          def execute(mode, workflow, inspect, compute, token):
              if mode == "launch":
                  if not workflow.active():
                      note("STOPPED: Workflow is disabled; a queued/re-run job will not launch.")
                      return
                  # Must succeed BEFORE any OCI launch or preflight that can fail.
                  workflow.disable()
              details = inspect()
              if details is None:
                  return
              if mode == "check":
                  note("CHECK OK: Read-only checks passed. No instance was created. "
                       "Write permissions, available capacity, and zero billing are not proven.")
                  return
              launch_once(compute, workflow, details, token)
          
          
          def main():
              env = os.environ
              mode = env.get("RUN_MODE", "check")
              if mode not in ("check", "launch"):
                  raise ValueError("RUN_MODE must be check or launch.")
              workflow = Workflow(env)
              # Settings are parsed after disabling for a live attempt, inside inspect().
              with tempfile.TemporaryDirectory(prefix="oci-key-", dir=env.get("RUNNER_TEMP")) as temp:
                  clients = {}
          
                  def inspect():
                      cfg = settings(env)
                      key = Path(temp) / "api.pem"
                      key.write_text(cfg["OCI_CLI_KEY_CONTENT"] + "\n", encoding="utf-8")
                      key.chmod(0o600)
                      auth = dict(user=cfg["OCI_CLI_USER"], tenancy=cfg["OCI_CLI_TENANCY"],
                                  fingerprint=cfg["OCI_CLI_FINGERPRINT"],
                                  region=cfg["OCI_CLI_REGION"], key_file=str(key))
                      oci.config.validate_config(auth)
                      options = dict(timeout=(10, 60), retry_strategy=oci.retry.NoneRetryStrategy())
                      clients["compute"] = oci.core.ComputeClient(auth, **options)
                      return preflight(
                          cfg, oci.identity.IdentityClient(auth, **options), clients["compute"],
                          oci.core.VirtualNetworkClient(auth, **options),
                          oci.core.BlockstorageClient(auth, **options))
          
                  class LazyCompute:
                      def launch_instance(self, *args, **kwargs):
                          return clients["compute"].launch_instance(*args, **kwargs)
          
                  token = hashlib.sha256(
                      (required(env, "GITHUB_REPOSITORY") + ":" + required(env, "GITHUB_RUN_ID"))
                      .encode()).hexdigest()
                  execute(mode, workflow, inspect, LazyCompute(), token)
          
          
          if __name__ == "__main__":
              try:
                  main()
              except Exception as exc:
                  if isinstance(exc, oci.exceptions.ServiceError):
                      print(f"STOPPED: OCI HTTP {exc.status}, code {exc.code}: {exc.message}", flush=True)
                  else:
                      # Do not print HTTP request objects, environment variables or credentials.
                      print(f"STOPPED: {type(exc).__name__}: {exc}", flush=True)
                  note("No further launch will be attempted by this run. For a launch-mode failure, "
                       "check workflow state and OCI Instances before manually enabling it again. "
                       "For timeouts/unknown errors, first confirm whether an instance was created.")
                  raise SystemExit(1)
          PY
